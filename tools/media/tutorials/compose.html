<!doctype html>
<!--
  CamOS tutorial videos, step 2: draws every frame of a take (record.mjs) on a canvas, the page in a browser window or a
  phone, the cursor, zoom, highlight and caption, and encodes it with WebCodecs (H.264), frame by frame.
  window.render({ take, bitrate }) resolves to the sample table (tvc/mux-mp4.mjs writes the MP4), window.part(start, end)
  hands the bytes over in base64 slices, window.still(k) draws frame k and returns it as a JPEG in base64.
-->
<html>
<head><meta charset="utf-8"><title>compose</title>
<style>body{margin:0;background:#000}</style></head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
'use strict';
const W = 1920, H = 1080;
const COL = { bg: '#1b242c', brand: '#18b693', text: '#ffffff', muted: '#a7b2bd', chrome: '#e3e7eb', dim: 'rgba(12,18,24,0.5)' };
const FONT = '"Segoe UI", Roboto, Arial, sans-serif';
const cv = document.getElementById('c');
const g = cv.getContext('2d');
let take, base, lastUse = [];
const cache = new Map();

async function load(url) {
    take = await (await fetch(url)).json();
    base = url.replace(/take\.json$/, '');
    // How long each frame's caption, highlight and scene have been on screen, for the fades
    let prev = null;
    lastUse = [];
    take.frames.forEach((f, k) => {
        f.sa = prev && prev.s === f.s ? prev.sa + 1 : 0;
        f.ta = prev && prev.t === f.t && prev.s === f.s ? prev.ta + 1 : 0;
        f.ha = prev && f.h && prev.h && prev.h.join() === f.h.join() ? prev.ha + 1 : 0;
        // Frames since the cursor last moved or clicked (a finger on the phone lifts after a moment)
        f.ci = prev && f.c && prev.c && prev.c.join() === f.c.join() && f.r === undefined ? prev.ci + 1 : 0;
        if (f.i >= 0) lastUse[f.i] = k;
        prev = f;
    });
}
const pad = (i) => String(i).padStart(5, '0');
function picture(i) {
    if (!cache.has(i)) cache.set(i, fetch(`${base}i${pad(i)}.jpg`).then(r => r.blob()).then(b => createImageBitmap(b)));
    return cache.get(i);
}
function release(k) {
    for (const [i, p] of cache) if (lastUse[i] < k) { cache.delete(i); p.then(b => b.close()); }
}

// Text wrapped to a width, at most `max` lines (the font shrinks until it fits)
function wrap(text, width, size, max, weight = '400') {
    for (let s = size; s >= size * 0.7; s -= 2) {
        g.font = `${weight} ${s}px ${FONT}`;
        const lines = [];
        let line = '';
        for (const word of text.split(' ')) {
            const next = line ? `${line} ${word}` : word;
            if (g.measureText(next).width > width && line) { lines.push(line); line = word; } else line = next;
        }
        if (line) lines.push(line);
        if (lines.length <= max) return { lines, size: s };
    }
    return { lines: [text], size: size * 0.7 };
}
function roundRect(x, y, w, h, r) {
    g.beginPath();
    g.roundRect(x, y, w, h, r);
}
const fade = (age, n = 8) => Math.min(1, age / n);

// Where a scene's page is drawn
function area(s) {
    if (s.kind === 'desktop') return { x: 224, y: 116, w: 1472, h: 1472 * s.h / s.w };
    if (s.kind === 'phone') { const h = 860, w = h * s.w / s.h; return { x: 560 - w / 2, y: 140, w, h }; }
    if (s.kind === 'image') { const k = Math.min(1800 / s.w, 840 / s.h); return { x: (W - s.w * k) / 2, y: 84 + (840 - s.h * k) / 2, w: s.w * k, h: s.h * k }; }
    return null;
}

function header() {
    g.fillStyle = COL.brand;
    roundRect(40, 22, 30, 30, 7); g.fill();
    g.fillStyle = '#fff';
    roundRect(46, 31, 18, 13, 3); g.fill();
    g.fillStyle = COL.brand;
    g.beginPath(); g.arc(55, 37.5, 3.6, 0, 7); g.fill();
    g.fillStyle = COL.text;
    g.font = `600 24px ${FONT}`;
    g.textBaseline = 'middle';
    g.fillText('CamOS', 84, 38);
    const w = g.measureText('CamOS').width;
    g.fillStyle = COL.muted;
    g.font = `400 24px ${FONT}`;
    g.fillText(`·  ${take.title}`, 84 + w + 10, 38);
}

function card(s, f) {
    const t = f.sa / take.fps;
    const title = take.texts[s.title] || '';
    const bullets = s.bullets || [];
    g.textAlign = 'center';
    g.textBaseline = 'alphabetic';
    if (!bullets.length) {
        g.globalAlpha = fade(f.sa, 12);
        const tl = wrap(title, 1500, 76, 2, '700');
        g.fillStyle = COL.text;
        g.font = `700 ${tl.size}px ${FONT}`;
        tl.lines.forEach((l, j) => g.fillText(l, W / 2, 470 - (tl.lines.length - 1) * 45 + j * 92));
        if (s.sub >= 0) {
            g.fillStyle = COL.brand;
            g.font = `500 36px ${FONT}`;
            g.fillText(take.texts[s.sub], W / 2, 570);
        }
    } else {
        g.globalAlpha = fade(f.sa, 10);
        g.fillStyle = COL.text;
        g.font = `700 64px ${FONT}`;
        g.fillText(title, W / 2, 250);
        g.textAlign = 'left';
        let y = 380;
        bullets.forEach((b, j) => {
            const at = 0.6 + j * 1.3;
            if (t < at) return;
            g.globalAlpha = Math.min(1, (t - at) / 0.35);
            const wl = wrap(take.texts[b], 1380, 40, 2);
            g.fillStyle = COL.brand;
            g.beginPath(); g.arc(270, y - wl.size * 0.33, 9, 0, 7); g.fill();
            g.fillStyle = COL.text;
            g.font = `400 ${wl.size}px ${FONT}`;
            wl.lines.forEach((l, i) => g.fillText(l, 305, y + i * wl.size * 1.3));
            y += wl.lines.length * wl.size * 1.3 + 40;
        });
    }
    g.globalAlpha = fade(f.sa, 12);
    if (s.foot >= 0) {
        g.textAlign = 'center';
        g.fillStyle = COL.muted;
        g.font = `400 28px ${FONT}`;
        g.fillText(take.texts[s.foot], W / 2, 1010);
    }
    g.globalAlpha = 1;
    g.textAlign = 'left';
}

function windowFrame(s, a, f) {
    // A plain browser window around the page, with its address
    g.fillStyle = COL.chrome;
    roundRect(a.x, a.y - 44, a.w, a.h + 44, 12); g.fill();
    ['#ff5f57', '#febc2e', '#28c840'].forEach((c, j) => { g.fillStyle = c; g.beginPath(); g.arc(a.x + 24 + j * 22, a.y - 22, 7, 0, 7); g.fill(); });
    g.fillStyle = '#fff';
    roundRect(a.x + 110, a.y - 35, a.w - 140, 27, 14); g.fill();
    if (f.a !== undefined) {
        g.fillStyle = '#3c4650';
        g.font = `400 17px ${FONT}`;
        g.textBaseline = 'middle';
        g.fillText(take.texts[f.a], a.x + 128, a.y - 21);
    }
}
function phoneFrame(a) {
    g.fillStyle = '#0d1115';
    roundRect(a.x - 16, a.y - 16, a.w + 32, a.h + 32, 54); g.fill();
    g.strokeStyle = '#3a4550'; g.lineWidth = 3;
    roundRect(a.x - 16, a.y - 16, a.w + 32, a.h + 32, 54); g.stroke();
}

function cursorAt(x, y, phone, scale) {
    if (phone) {
        g.fillStyle = 'rgba(30,40,50,0.28)'; g.strokeStyle = 'rgba(255,255,255,0.9)'; g.lineWidth = 2.5;
        g.beginPath(); g.arc(x, y, 22, 0, 7); g.fill(); g.stroke();
        return;
    }
    const k = 1.25 * scale;
    g.save();
    g.translate(x, y); g.scale(k, k);
    g.beginPath();
    g.moveTo(0, 0); g.lineTo(0, 24); g.lineTo(6, 18.5); g.lineTo(10.5, 28); g.lineTo(14.5, 26); g.lineTo(10, 16.8); g.lineTo(17.5, 16.8); g.closePath();
    g.fillStyle = '#fff'; g.fill();
    g.strokeStyle = '#111'; g.lineWidth = 1.6; g.lineJoin = 'round'; g.stroke();
    g.restore();
}

function caption(f, s) {
    if (f.t < 0) return;
    const text = take.texts[f.t];
    g.globalAlpha = fade(f.ta, 7);
    g.fillStyle = COL.text;
    g.textBaseline = 'alphabetic';
    if (s.kind === 'phone') {
        const wl = wrap(text, 860, 46, 6, '500');
        g.font = `500 ${wl.size}px ${FONT}`;
        const lh = wl.size * 1.32;
        let y = 572 - (wl.lines.length * lh) / 2 + wl.size;
        g.fillStyle = COL.brand;
        g.fillRect(900, y - wl.size - 4, 6, wl.lines.length * lh);
        g.fillStyle = COL.text;
        wl.lines.forEach((l) => { g.fillText(l, 930, y); y += lh; });
    } else {
        const wl = wrap(text, 1720, 38, 2, '500');
        g.font = `500 ${wl.size}px ${FONT}`;
        g.textAlign = 'center';
        const lh = wl.size * 1.3;
        const top = 1012 - (wl.lines.length - 1) * lh / 2;
        wl.lines.forEach((l, j) => g.fillText(l, W / 2, top + j * lh + wl.size * 0.35));
        g.textAlign = 'left';
    }
    g.globalAlpha = 1;
}

async function draw(k) {
    const f = take.frames[k];
    const s = take.scenes[f.s];
    g.fillStyle = COL.bg;
    g.fillRect(0, 0, W, H);
    header();
    if (s.kind === 'card') { card(s, f); return; }
    const a = area(s);
    if (s.kind === 'desktop') windowFrame(s, a, f);
    if (s.kind === 'phone') phoneFrame(a);
    // The page, or the zoomed part of it (z: CSS pixels)
    const z = f.z || [0, 0, s.w, s.h];
    const bmp = f.i >= 0 ? await picture(f.i) : null;
    g.save();
    roundRect(a.x, a.y, a.w, a.h, s.kind === 'phone' ? 40 : s.kind === 'desktop' ? 0 : 6);
    g.clip();
    g.fillStyle = '#fff'; g.fillRect(a.x, a.y, a.w, a.h);
    if (bmp) g.drawImage(bmp, z[0] * s.dsf, z[1] * s.dsf, z[2] * s.dsf, z[3] * s.dsf, a.x, a.y, a.w, a.h);
    const sx = a.w / z[2], sy = a.h / z[3];
    const map = (x, y) => [a.x + (x - z[0]) * sx, a.y + (y - z[1]) * sy];
    if (f.h) {
        const [hx, hy] = map(f.h[0], f.h[1]);
        const hw = f.h[2] * sx, hh = f.h[3] * sy;
        const al = fade(f.ha, 8);
        g.globalAlpha = al;
        g.beginPath();
        g.rect(a.x, a.y, a.w, a.h);
        g.roundRect(hx, hy, hw, hh, 10);
        g.fillStyle = COL.dim;
        g.fill('evenodd');
        g.strokeStyle = COL.brand; g.lineWidth = 4;
        roundRect(hx, hy, hw, hh, 10); g.stroke();
        g.globalAlpha = 1;
    }
    if (f.c) {
        const [cx, cy] = map(f.c[0], f.c[1]);
        if (f.r !== undefined) {
            const r = f.r;
            g.globalAlpha = Math.max(0, 1 - r / 18);
            g.strokeStyle = COL.brand; g.lineWidth = 5;
            g.beginPath(); g.arc(cx, cy, 12 + r * 2.4, 0, 7); g.stroke();
            g.globalAlpha = 1;
        }
        g.globalAlpha = s.kind === 'phone' ? Math.max(0, 1 - Math.max(0, f.ci - 25) / 10) : 1;
        if (g.globalAlpha > 0) cursorAt(cx, cy, s.kind === 'phone', Math.sqrt(sx));
        g.globalAlpha = 1;
    }
    g.restore();
    caption(f, s);
    if (f.sa < 8) {
        g.globalAlpha = 1 - f.sa / 8;
        g.fillStyle = COL.bg;
        g.fillRect(0, 70, W, H - 70);
        g.globalAlpha = 1;
    }
}

let track = null;
function keep(chunk, meta) {
    if (meta?.decoderConfig?.description && !track.description) {
        const d = meta.decoderConfig.description;
        track.description = new Uint8Array(ArrayBuffer.isView(d) ? d.buffer.slice(d.byteOffset, d.byteOffset + d.byteLength) : d.slice(0));
    }
    const bytes = new Uint8Array(chunk.byteLength);
    chunk.copyTo(bytes);
    track.parts.push(bytes);
    track.samples.push({ size: bytes.length, ts: chunk.timestamp, dur: chunk.duration || 0, key: chunk.type === 'key' });
    track.size += bytes.length;
}

async function render({ take: url, bitrate = 1500000, qp = 0, keyEvery = 5 }) {
    await load(url);
    const fps = take.fps;
    track = { samples: [], parts: [], size: 0, description: null, data: null };
    let failure = null;
    const enc = new VideoEncoder({ output: keep, error: (e) => { failure = e; } });
    // qp: a fixed quantizer (still screens cost almost nothing), else a variable bitrate
    enc.configure({ codec: 'avc1.640028', width: W, height: H, framerate: fps, avc: { format: 'avc' }, latencyMode: 'quality', ...(qp ? { bitrateMode: 'quantizer' } : { bitrate, bitrateMode: 'variable' }) });
    for (let k = 0; k < take.frames.length; k++) {
        if (failure) throw failure;
        await draw(k);
        release(k);
        const frame = new VideoFrame(cv, { timestamp: Math.round(k * 1e6 / fps), duration: Math.round(1e6 / fps) });
        enc.encode(frame, { keyFrame: k % (fps * keyEvery) === 0, ...(qp ? { avc: { quantizer: qp } } : {}) });
        frame.close();
        while (enc.encodeQueueSize > 4) await new Promise(r => enc.addEventListener('dequeue', r, { once: true }));
    }
    await enc.flush();
    enc.close();
    if (failure) throw failure;
    track.data = new Uint8Array(track.size);
    let at = 0;
    for (const p of track.parts) { track.data.set(p, at); at += p.length; }
    track.parts = [];
    const hex = track.description ? [...track.description].map(b => b.toString(16).padStart(2, '0')).join('') : null;
    return { samples: track.samples, size: track.size, description: hex, width: W, height: H, fps, frames: take.frames.length };
}
const toBase64 = (blob) => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result.split(',')[1]); r.readAsDataURL(blob); });
async function part(start, end) { return toBase64(new Blob([track.data.subarray(start, end)])); }
async function still(url, k, quality = 0.86) {
    if (!take || !base || !url.startsWith(base)) await load(url);
    await draw(Math.min(k, take.frames.length - 1));
    return toBase64(await new Promise(res => cv.toBlob(res, 'image/jpeg', quality)));
}
window.render = render;
window.part = part;
window.still = still;
</script>
</body>
</html>
