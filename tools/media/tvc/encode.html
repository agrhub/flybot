<!doctype html>
<!--
  Encodes the rendered frames and the synthesized music with WebCodecs (H.264 + AAC), frame by
  frame and not in real time, so a busy machine cannot drop frames. The packets stay in the page:
  window.encode({ frameUrl, count, fps, bitrate, width, height, music }) resolves to the sample tables and the codec
  setup, window.part(track, start, end) hands the bytes over in base64 slices, and mux-mp4.mjs
  writes the MP4.
-->
<html>
<head><meta charset="utf-8"><title>encode</title></head>
<body style="margin:0;background:#000">
<script src="music.js"></script>
<script>
const tracks = {};

// Packets of one track, kept in decode order
function collector() {
    return { samples: [], parts: [], size: 0, description: null, data: null };
}
function keep(track, chunk, meta) {
    if (meta?.decoderConfig?.description && !track.description) {
        const d = meta.decoderConfig.description;
        track.description = new Uint8Array(ArrayBuffer.isView(d) ? d.buffer.slice(d.byteOffset, d.byteOffset + d.byteLength) : d.slice(0));
    }
    const bytes = new Uint8Array(chunk.byteLength);
    chunk.copyTo(bytes);
    track.parts.push(bytes);
    track.samples.push({ size: bytes.length, ts: chunk.timestamp, dur: chunk.duration || 0, key: chunk.type === 'key' });
    track.size += bytes.length;
}
function join(track) {
    track.data = new Uint8Array(track.size);
    let at = 0;
    for (const p of track.parts) { track.data.set(p, at); at += p.length; }
    track.parts = [];
}
const toHex = (u8) => [...u8].map(b => b.toString(16).padStart(2, '0')).join('');

async function encodeVideo({ frameUrl, count, fps, bitrate, width, height }) {
    const track = tracks.video = collector();
    let failure = null;
    const enc = new VideoEncoder({ output: (c, m) => keep(track, c, m), error: (e) => { failure = e; } });
    enc.configure({ codec: 'avc1.640028', width, height, bitrate, framerate: fps, avc: { format: 'avc' }, latencyMode: 'quality' });
    const load = (i) => fetch(frameUrl(i)).then(r => r.blob()).then(b => createImageBitmap(b));
    // A few frames decoded ahead
    const ahead = [];
    for (let i = 0; i < Math.min(8, count); i++) ahead.push(load(i));
    for (let i = 0; i < count; i++) {
        if (failure) throw failure;
        const bmp = await ahead.shift();
        if (i + 8 < count) ahead.push(load(i + 8));
        const frame = new VideoFrame(bmp, { timestamp: Math.round(i * 1e6 / fps), duration: Math.round(1e6 / fps) });
        // A key frame every two seconds, for seeking
        enc.encode(frame, { keyFrame: i % (fps * 2) === 0 });
        frame.close();
        bmp.close();
        while (enc.encodeQueueSize > 6) await new Promise(r => enc.addEventListener('dequeue', r, { once: true }));
    }
    await enc.flush();
    enc.close();
    if (failure) throw failure;
    join(track);
}

async function encodeAudio(seconds, arrangement) {
    const track = tracks.audio = collector();
    const music = await makeMusic(seconds, arrangement);
    const rate = music.sampleRate, channels = music.numberOfChannels;
    let failure = null;
    const enc = new AudioEncoder({ output: (c, m) => keep(track, c, m), error: (e) => { failure = e; } });
    enc.configure({ codec: 'mp4a.40.2', sampleRate: rate, numberOfChannels: channels, bitrate: 192000 });
    const BLOCK = 1024;
    const data = [...Array(channels)].map((_, c) => music.getChannelData(c));
    // Loudest peak to -1 dBFS
    let peak = 0;
    for (const ch of data) for (let i = 0; i < ch.length; i++) peak = Math.max(peak, Math.abs(ch[i]));
    if (peak > 0) for (const ch of data) for (let i = 0; i < ch.length; i++) ch[i] *= 0.89 / peak;
    for (let at = 0; at < music.length; at += BLOCK) {
        const n = Math.min(BLOCK, music.length - at);
        const planar = new Float32Array(n * channels);
        for (let c = 0; c < channels; c++) planar.set(data[c].subarray(at, at + n), c * n);
        const ad = new AudioData({ format: 'f32-planar', sampleRate: rate, numberOfFrames: n, numberOfChannels: channels, timestamp: Math.round(at * 1e6 / rate), data: planar });
        enc.encode(ad);
        ad.close();
    }
    await enc.flush();
    enc.close();
    if (failure) throw failure;
    join(track);
    return { rate, channels };
}

// music: the arrangement's name in music.js
async function encode({ frameUrl, count, fps = 30, bitrate = 8000000, width = 1920, height = 1080, music = 'landscape' }) {
    const seconds = count / fps;
    await encodeVideo({ frameUrl, count, fps, bitrate, width, height });
    const { rate, channels } = await encodeAudio(seconds, music);
    const describe = (t) => ({ samples: t.samples, size: t.size, description: t.description ? toHex(t.description) : null });
    return {
        video: { ...describe(tracks.video), width, height, fps },
        audio: { ...describe(tracks.audio), rate, channels }
    };
}

// Bytes start..end of a track's packets, in base64
async function part(name, start, end) {
    const blob = new Blob([tracks[name].data.subarray(start, end)]);
    return new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result.split(',')[1]); r.readAsDataURL(blob); });
}
window.encode = encode;
window.part = part;
</script>
</body>
</html>
