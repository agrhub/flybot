<!doctype html>
<!--
  The film's sound: the synthesized music bed (../tvc/music.js), quieter under the voice, and the voice-over lines
  (media/voice/*.wav) at their cues. window.mix(film) resolves to the byte size of a 16-bit WAV kept in the page;
  window.part(start, end) hands it over in base64 slices (render-film.mjs writes it, encode.html encodes it).
-->
<html>
<head><meta charset="utf-8"><title>mix</title></head>
<body>
<script src="/tvc/music.js"></script>
<script>
const RATE = 48000;
let wav = null;

// A calm bed for the whole film: pads and bass on the music's 2.4 s bars, a soft beat under the app demo
function arrangement(film) {
    const BAR = window.MUSIC.BAR;
    const bars = Math.ceil(film.duration / BAR) + 1;
    const cycle = ['Am', 'F', 'C', 'G'];
    const at = (id) => film.scenes.find(s => s.id === id);
    const from = Math.floor(at('guest').start / BAR), to = Math.ceil((at('mapreports').start + at('mapreports').len) / BAR);
    return {
        progression: [...Array(bars)].map((_, i) => cycle[i % 4]),
        quietTo: bars, bassFrom: 2, halfKick: [from, to], groove: [0, 0], clapFrom: bars + 1,
        brand: [0], rise: 1, hits: [], endFrom: Math.max(0, bars - 4)
    };
}

function toWav(buf) {
    const ch = buf.numberOfChannels, n = buf.length;
    const out = new DataView(new ArrayBuffer(44 + n * ch * 2));
    const str = (o, s) => [...s].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
    str(0, 'RIFF'); out.setUint32(4, 36 + n * ch * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
    out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, ch, true); out.setUint32(24, buf.sampleRate, true);
    out.setUint32(28, buf.sampleRate * ch * 2, true); out.setUint16(32, ch * 2, true); out.setUint16(34, 16, true);
    str(36, 'data'); out.setUint32(40, n * ch * 2, true);
    const data = [...Array(ch)].map((_, c) => buf.getChannelData(c));
    let o = 44;
    for (let i = 0; i < n; i++) for (let c = 0; c < ch; c++) { const v = Math.max(-1, Math.min(1, data[c][i])); out.setInt16(o, v < 0 ? v * 0x8000 : v * 0x7fff, true); o += 2; }
    return new Uint8Array(out.buffer);
}

async function mix(film) {
    const seconds = film.duration;
    // Another cut (../promo) brings its own arrangement
    const music = await makeMusic(seconds, film.arrangement || arrangement(film), RATE);
    const ctx = new OfflineAudioContext(2, Math.ceil(seconds * RATE), RATE);
    // Music: 0.32, ducked to 0.11 while a line is spoken
    const bed = ctx.createBufferSource(); bed.buffer = music;
    const g = ctx.createGain(); g.gain.setValueAtTime(0.32, 0);
    for (const c of film.cues) {
        if (!c.voice) continue;
        g.gain.setTargetAtTime(0.11, Math.max(0, c.start - 0.25), 0.12);
        g.gain.setTargetAtTime(0.32, c.end + 0.2, 0.4);
    }
    bed.connect(g).connect(ctx.destination); bed.start(0);
    for (const c of film.cues) {
        if (!c.voice) continue;
        const data = await (await fetch('/' + c.voice)).arrayBuffer();
        const buf = await ctx.decodeAudioData(data);
        const src = ctx.createBufferSource(); src.buffer = buf;
        const vg = ctx.createGain(); vg.gain.value = 0.95;
        src.connect(vg).connect(ctx.destination); src.start(c.start);
    }
    wav = toWav(await ctx.startRendering());
    return wav.length;
}
async function part(start, end) {
    const blob = new Blob([wav.subarray(start, end)]);
    return new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result.split(',')[1]); r.readAsDataURL(blob); });
}
window.mix = mix;
window.part = part;
</script>
</body>
</html>
