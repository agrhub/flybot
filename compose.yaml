# Compute Engine VM deployment: docker compose up -d --build
# Docker restarts the container if it crashes or the VM reboots.
services:
  flybot:
    build:
      context: .
      args:
        VITE_GOOGLE_MAP_KEY: ${VITE_GOOGLE_MAP_KEY:-}
    image: flybot:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Always production here, whatever .env says (development logs emails instead of dropping them)
      NODE_ENV: production
      PORT: "8080"
      # Credentials come from the VM's attached service account (no key file needed).
      # To use a key file instead, mount it and set GOOGLE_APPLICATION_CREDENTIALS to its path.
      GOOGLE_APPLICATION_CREDENTIALS: ""
    ports:
      - "${HOST_PORT:-3000}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
