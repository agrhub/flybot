# Non-secret Cloud Run settings (passed with --env-vars-file). Secrets live in Secret Manager, see DEPLOY.md.
# Fill in the TODO values before the first deploy.
NODE_ENV: "production"
COOKIE_SECURE: "true"
TRUST_PROXY: "1"
# Set to "false" if the VM runs the background jobs against the same database
ENABLE_CRON: "true"
ALLOW_REGISTRATION: "true"

EZVIZ_DOMAIN: "https://ivnopen.ezvizlife.com"
# "true" after checking it with your EZVIZ account (see DEPLOY.md, Known risks)
EZVIZ_RAM_TOKENS: "false"

S3_REGION: "us-east-1"
S3_ENDPOINT: "TODO: same as S3_ENDPOINT in your .env"
S3_BUCKET_NAME: "TODO: same as S3_BUCKET_NAME in your .env"

AI_PROVIDER: "roboflow"
ROBOFLOW_WORKFLOW_URL: "TODO: same as ROBOFLOW_WORKFLOW_URL in your .env"
# Optional: Roboflow project that receives reviewed photos for retraining (empty = off)
ROBOFLOW_UPLOAD_PROJECT: ""
ROBOFLOW_UPLOAD_CLASS: "fruit_fly"
VERTEX_PROJECT_ID: "TODO: your GCP project id"
VERTEX_LOCATION: "us-central1"
VERTEX_MODEL: "gemini-2.5-flash"

RETENTION_CYCLE: "12"

# Public URL of the web app, used in email links (password reset, email confirmation).
# Left empty, the deploy script sets it to the Cloud Run service URL. Set your custom domain here if you have one.
APP_BASE_URL: ""

# Email over SMTP (Google Workspace, SendGrid, Resend, Mailgun...). Empty SMTP_HOST = no emails.
# Empty values are filled from .env by the deploy script. SMTP_PASS is stored in Secret Manager.
SMTP_HOST: ""
SMTP_PORT: "587"
SMTP_SECURE: "false"
SMTP_USER: ""
MAIL_FROM: ""

# Telegram alerts: bot username from @BotFather (without @). Empty = Telegram off.
# The bot token is stored in Secret Manager (flybot-telegram-bot-token) by the deploy script.
TELEGRAM_BOT_USERNAME: ""

# Push notifications (installed app / browser). Create the pair once with
# "node server/scripts/generate_vapid_keys.js" and keep it: new keys cut off every subscribed device.
# Empty values are filled from .env. VAPID_PRIVATE_KEY is stored in Secret Manager (flybot-vapid-private-key).
VAPID_PUBLIC_KEY: ""
VAPID_SUBJECT: ""

# Public contact address shown on the legal pages; receives the contact form (empty = the admins)
CONTACT_EMAIL: ""
