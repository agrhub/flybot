<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlyBot - Smart Trap & Vision AI Studio</title>
    <!-- Google Fonts Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'primary-green': '#3ecf8e',
              'primary-dark-green': '#006c45',
            },
            fontFamily: {
              sans: ['Outfit', 'Inter', 'Quicksand', 'sans-serif'],
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-[#121414] text-[#f0f2f1] font-sans antialiased selection:bg-[#3ecf8e] selection:text-[#002112]">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
